<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#172a45"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg)"/>
  <circle cx="260" cy="250" r="140" stroke="url(#teal)" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="540" cy="250" r="140" stroke="url(#cyan)" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  <!-- Auditory Cortex / Brain Graphic -->
  <g transform="translate(180, 160)" stroke="url(#teal)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80,30 C 50,30 20,55 20,95 C 20,135 45,160 70,170 C 95,180 130,175 145,150 C 160,125 155,95 140,80 C 130,70 125,50 110,40 C 95,30 90,30 80,30 Z"/>
    <path d="M 50,75 C 65,70 85,85 85,105 C 85,125 70,135 60,140" stroke-width="2.5" opacity="0.8"/>
    <path d="M 95,65 C 115,70 125,95 120,120 C 115,140 95,150 85,155" stroke-width="2.5" opacity="0.8"/>
    <circle cx="90" cy="110" r="6" fill="#2dd4bf" filter="url(#glow)"/>
    <circle cx="65" cy="85" r="4" fill="#38bdf8"/>
    <circle cx="120" cy="95" r="4" fill="#38bdf8"/>
    <circle cx="75" cy="145" r="4" fill="#2dd4bf"/>
  </g>
  <!-- Neural Pathway connection waves -->
  <g stroke="url(#cyan)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M 330,230 C 370,210 430,210 470,230"/>
    <path d="M 340,250 C 380,250 420,250 460,250" stroke-dasharray="8 6"/>
    <path d="M 330,270 C 370,290 430,290 470,270"/>
  </g>
  <!-- Ear Graphic -->
  <g transform="translate(470, 160)" stroke="url(#cyan)" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 50,50 C 95,30 115,75 110,110 C 105,145 75,160 65,175 C 55,190 45,185 40,175 C 35,165 45,150 50,140 C 60,120 70,105 60,85 C 50,65 30,70 40,55 Z"/>
    <path d="M 65,95 C 75,105 75,120 65,130" stroke-width="2.5" opacity="0.7"/>
    <circle cx="65" cy="115" r="5" fill="#38bdf8" filter="url(#glow)"/>
  </g>
  <!-- Labels -->
  <text x="400" y="380" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Brain &amp; Auditory Pathway Connection</text>
  <text x="400" y="412" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Cognitive stimulation through clear, natural hearing</text>
</svg>