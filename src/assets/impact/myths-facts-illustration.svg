<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="mythBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#mythBg)"/>
  
  <!-- Left Card: Myth -->
  <g transform="translate(100, 90)">
    <rect width="270" height="250" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#ef4444" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="135" cy="70" r="32" fill="#ef4444" fill-opacity="0.15"/>
    <!-- X Mark -->
    <path d="M 123,58 L 147,82 M 147,58 L 123,82" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round"/>
    <text x="135" y="140" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="20" font-weight="700">MYTH</text>
    <text x="135" y="175" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">"Hearing loss is just</text>
    <text x="135" y="197" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">part of getting older</text>
    <text x="135" y="219" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">and cannot be helped."</text>
  </g>

  <!-- Balance / Arrow Bridge in middle -->
  <g transform="translate(370, 195)" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 10,25 L 50,25 M 38,13 L 50,25 L 38,37"/>
  </g>

  <!-- Right Card: Fact -->
  <g transform="translate(430, 90)">
    <rect width="270" height="250" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="135" cy="70" r="32" fill="#10b981" fill-opacity="0.15"/>
    <!-- Checkmark -->
    <path d="M 121,70 L 131,80 L 149,60" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="140" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="700">FACT</text>
    <text x="135" y="175" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">"Modern solutions restore</text>
    <text x="135" y="197" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">speech clarity and protect</text>
    <text x="135" y="219" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">lifelong brain health."</text>
  </g>

  <!-- Footer Banner -->
  <text x="400" y="400" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Separating Common Myths From Audiological Evidence</text>
  <text x="400" y="432" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Evidence-based clinical care empowers you to take charge early</text>
</svg>
