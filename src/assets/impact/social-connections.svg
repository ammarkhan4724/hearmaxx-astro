<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg2)"/>
  <!-- Ambient background soundwaves (filtered noise) -->
  <g opacity="0.25" stroke="#64748b" stroke-width="2" fill="none">
    <path d="M 50,150 Q 150,100 250,150 T 450,150 T 650,150 T 750,150"/>
    <path d="M 50,200 Q 150,250 250,200 T 450,200 T 650,200 T 750,200"/>
    <path d="M 50,300 Q 150,260 250,300 T 450,300 T 650,300 T 750,300"/>
  </g>
  <!-- Person 1 (Speaker) -->
  <g transform="translate(180, 160)" stroke="url(#skyGrad)" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="70" cy="50" r="28" stroke-width="3"/>
    <path d="M 25,130 C 25,95 50,85 70,85 C 90,85 115,95 115,130" stroke-width="3"/>
  </g>
  <!-- Speech Bubble with clarity soundwaves -->
  <g transform="translate(320, 140)">
    <rect width="160" height="80" rx="18" fill="#1e293b" stroke="url(#skyGrad)" stroke-width="2"/>
    <path d="M 350,220 L 335,235 L 365,220 Z" fill="#1e293b" stroke="url(#skyGrad)" stroke-width="2"/>
    <!-- Clear sound frequencies -->
    <line x1="355" y1="180" x2="355" y2="180" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="375" y1="168" x2="375" y2="192" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="395" y1="160" x2="395" y2="200" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <line x1="415" y1="165" x2="415" y2="195" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="435" y1="172" x2="435" y2="188" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Person 2 (Listener engaged with hearing care) -->
  <g transform="translate(490, 160)" stroke="url(#roseGrad)" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="70" cy="50" r="28" stroke-width="3"/>
    <path d="M 25,130 C 25,95 50,85 70,85 C 90,85 115,95 115,130" stroke-width="3"/>
    <!-- Subtle hearing solution accent on ear -->
    <path d="M 98,46 C 103,42 108,50 106,56" stroke="#38bdf8" stroke-width="3"/>
  </g>
  <!-- Labels -->
  <text x="400" y="380" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Staying Connected in Social Gatherings</text>
  <text x="400" y="412" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Filter background noise and participate with ease and confidence</text>
</svg>